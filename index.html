<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carnestoltes ULTRALIGHT ✅</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 1rem;
    }
    h1 { text-align: center; font-size: 1.1rem; }
    video { width: 100%; border-radius: 10px; background: #000; min-height: 200px; }
    button {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: .5rem;
      border: none;
      border-radius: 8px;
      background: #0070f3;
      color: #fff;
    }
    pre {
      background: #000;
      padding: .5rem;
      border-radius: 8px;
      font-size: .8rem;
      color: #0f0;
      max-height: 6rem;
      overflow-y: auto;
    }
    .info {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>Carnestoltes ULTRALIGHT ✅</h1>

  <button id="scanBtn">ESCANEJAR QR</button>
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <pre id="log"></pre>

  <div class="info" id="info" style="display:none;">
    <p><b>QR:</b> <span id="qrText"></span></p>
    <p><b>Nom:</b> <span id="nom"></span></p>
    <p><b>Pagat:</b> <span id="pagat"></span></p>
    <p><b>Objectes:</b> <span id="objectes"></span></p>
  </div>

  <!-- jsQR ligero -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const API_BASE = "https://script.google.com/macros/s/AKfycbzorimMb3iHXg0_mp9ZOt9G-Z56HQ--CM2aiE3iSVpSkgy7f6aBrZuNHSSjM9Asvd5z/exec";

    const scanBtn = document.getElementById("scanBtn");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const logBox = document.getElementById("log");
    const infoBox = document.getElementById("info");
    const qrText = document.getElementById("qrText");
    const nom = document.getElementById("nom");
    const pagat = document.getElementById("pagat");
    const objectes = document.getElementById("objectes");

    let scanning = false;
    let stream = null;
    let ctx = canvas.getContext("2d");

    function log(msg) {
      console.log(msg);
      logBox.textContent += msg + "\n";
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function lookup(qr) {
      const res = await fetch(`${API_BASE}?action=lookup&qr=${encodeURIComponent(qr)}`);
      return res.json();
    }

    async function startScan() {
      if (scanning) return;
      scanning = true;
      scanBtn.textContent = "ESCANEJANT...";

      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        await video.play();
        log("🎥 Càmera oberta");

        requestAnimationFrame(tick);
      } catch (err) {
        log("❌ Error càmera: " + err.message);
        scanning = false;
      }
    }

    function stopScan() {
      scanning = false;
      scanBtn.textContent = "ESCANEJAR QR";
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    async function tick() {
      if (!scanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);

        if (code) {
          const qr = code.data.trim();
          log("QR detectat: " + qr);
          stopScan();

          const data = await lookup(qr);
          log("Resposta: " + JSON.stringify(data));

          qrText.textContent = qr;
          nom.textContent = data.nom || "-";
          pagat.textContent = data.pagat ? "✅ SI" : "❌ NO";
          objectes.textContent = data.objectesEntregats ? "✅ ENTREGATS" : "❌ NO";

          infoBox.style.display = "block";
          return;
        }
      }
      requestAnimationFrame(tick);
    }

    scanBtn.addEventListener("click", () => {
      if (scanning) {
        stopScan();
      } else {
        startScan();
      }
    });
  </script>
</body>
</html>
