<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Carnestoltes CONTROL ✅</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background-color: #111;
    color: #fff;
    margin: 0;
    padding: 1rem;
  }

  h1 {
    font-size: 1.2rem;
    font-weight: 600;
    color: #fff;
    text-align: center;
    display: flex;
    justify-content: center;
    gap: .5rem;
    flex-wrap: wrap;
    margin: 0 0 1rem;
  }

  .badge {
    background: #0a0;
    color: #000;
    font-size: .8rem;
    font-weight: 700;
    border-radius: .4rem;
    padding: .1rem .4rem;
    line-height: 1.2;
  }

  .card {
    background: #1e1e1e;
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }

  #scanBtn {
    width: 100%;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 1rem;
    border-radius: 10px;
    border: 0;
    background: #0070f3;
    color: #fff;
    margin-bottom: 1rem;
    text-align:center;
  }
  #scanBtn.active {
    background: #00b800;
    color: #000;
  }

  video {
    width: 100%;
    border-radius: 10px;
    background: #000;
    min-height: 220px;
    object-fit: cover;
    display: block;
  }

  canvas { display:none; }

  #debugLog {
    font-size: .75rem;
    line-height: 1.4;
    color: #0f0;
    font-family: monospace;
    white-space: pre-line;
    min-height: 3em;
    max-height: 8em;
    overflow-y: auto;
  }

  /* Tarjeta info fixa sota la càmera */
  #infoCard { display:none; }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: .75rem;
    flex-wrap: wrap;
  }

  .label {
    font-size: .8rem;
    color: #aaa;
    flex: 0 0 40%;
  }

  .value {
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    flex: 0 0 60%;
    text-align: right;
    word-break: break-word;
  }

  .qr-code-value {
    font-size: .8rem;
    font-weight: 400;
    color: #888;
    text-align: right;
    word-break: break-word;
  }

  .warning-box {
    border-radius: 8px;
    padding: .6rem .75rem;
    font-size: .9rem;
    font-weight: 600;
    margin-bottom: .5rem;
  }
  .warning-red {
    background: #3a0000;
    color: #ff4d4d;
    border: 1px solid #ff4d4d;
  }
  .warning-yellow {
    background: #3a3000;
    color: #ffd84d;
    border: 1px solid #ffd84d;
  }

  .section-title {
    font-size: .9rem;
    font-weight: 600;
    color: #ccc;
    margin: .75rem 0 .5rem;
  }

  .btn-col {
    display: flex;
    flex-direction: column;
    gap: .75rem;
    width: 100%;
  }

  .state-btn {
    width: 100%;
    font-size: 1rem;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    padding: 1rem .75rem;
    color: #fff;
    text-align: center;
  }

  .greenState {
    background: #00b800;
    color: #000;
  }

  .redState {
    background: #b80000;
    color: #fff;
  }

  .footer-note {
    font-size: .7rem;
    color: #999;
    text-align: center;
    margin-top: .5rem;
  }

  /* Popup modal */
  #modalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 9999;
  }

  #modalCard {
    background: #1e1e1e;
    border-radius: 16px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    padding: 1rem 1rem 0.75rem;
    color: #fff;
    text-align: left;
  }

  #modalTitle {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: .75rem;
    color: #fff;
  }

  .modalRowLabel {
    font-size: .8rem;
    color: #aaa;
  }

  .modalRowValue {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: .5rem;
  }

  .modalStatusGreen {
    color: #00ff80;
    font-weight: 600;
  }
  .modalStatusRed {
    color: #ff4d4d;
    font-weight: 600;
  }

  #modalCloseBtn {
    width: 100%;
    background: #0070f3;
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: .9rem .75rem;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    margin-top: .75rem;
    margin-bottom: .5rem;
  }
</style>
</head>
<body>

<h1>
  Carnestoltes CONTROL
  <span class="badge">ONLINE</span>
</h1>

<!-- Càmera -->
<div class="card">
  <button id="scanBtn">ESCANEJAR QR</button>
  <video id="preview" playsinline autoplay muted></video>
  <canvas id="framegrab"></canvas>
</div>

<!-- Info persona (persistent sota càmera) -->
<div class="card" id="infoCard">
  <div class="row">
    <div class="label">Nom</div>
    <div class="value" id="nomValue">-</div>
  </div>

  <div class="row">
    <div class="label">QR</div>
    <div class="qr-code-value" id="qrValue">(sense)</div>
  </div>

  <div id="alertContainer"></div>

  <div class="section-title">Accions ràpides</div>

  <div class="btn-col">
    <button class="state-btn" id="btnTogglePagat">...</button>
    <button class="state-btn" id="btnToggleObjectes">...</button>
  </div>

  <div class="footer-note" id="dataPagamentNote"></div>
</div>

<!-- Debug -->
<div class="card">
  <div id="debugLog">📹 Llista d'esdeveniments…</div>
</div>

<!-- Popup modal resum -->
<div id="modalOverlay">
  <div id="modalCard">
    <div id="modalTitle">Detalls participant</div>

    <div class="modalRow">
      <div class="modalRowLabel">Nom</div>
      <div class="modalRowValue" id="modalNom">-</div>
    </div>

    <div class="modalRow">
      <div class="modalRowLabel">Pagament</div>
      <div class="modalRowValue" id="modalPagament">-</div>
    </div>

    <div class="modalRow">
      <div class="modalRowLabel">Objectes</div>
      <div class="modalRowValue" id="modalObjectes">-</div>
    </div>

    <button id="modalCloseBtn">OK</button>
  </div>
</div>

<script>
/* =============== CONFIG =============== */
const API_BASE = "https://script.google.com/macros/s/AKfycbw_D0Gf5yja1d8hgIULvsdS8tKjGyt2W1P_8G6qzPttiNIsd3UpCADV89yONey3H1Z4uw/exec";

/* =============== STATE =============== */
let scanning = false;
let streamRef = null;
let detector = null;

let lastShownQR = null;
let currentQR = null;
let currentData = null;

/* =============== DOM =============== */
const scanBtn = document.getElementById('scanBtn');
const preview = document.getElementById('preview');
const canvas  = document.getElementById('framegrab');
const debugLog = document.getElementById('debugLog');

const infoCard = document.getElementById('infoCard');
const nomValue = document.getElementById('nomValue');
const qrValue  = document.getElementById('qrValue');
const alertContainer = document.getElementById('alertContainer');
const dataPagamentNote = document.getElementById('dataPagamentNote');

const btnTogglePagat = document.getElementById('btnTogglePagat');
const btnToggleObjectes = document.getElementById('btnToggleObjectes');

const modalOverlay = document.getElementById('modalOverlay');
const modalCloseBtn = document.getElementById('modalCloseBtn');
const modalNom = document.getElementById('modalNom');
const modalPagament = document.getElementById('modalPagament');
const modalObjectes = document.getElementById('modalObjectes');

/* =============== UI HELPERS =============== */
function log(msg){
  console.log(msg);
  debugLog.textContent += "\n" + msg;
  debugLog.scrollTop = debugLog.scrollHeight;
}

function showInfoCard() {
  infoCard.style.display = "block";
}

function statusLabelGreen(text) {
  return `<span class="modalStatusGreen">${text}</span>`;
}
function statusLabelRed(text) {
  return `<span class="modalStatusRed">${text}</span>`;
}

function openModal() {
  modalOverlay.style.display = "flex";
}
function closeModal() {
  modalOverlay.style.display = "none";
}

modalCloseBtn.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (ev)=>{
  if (ev.target === modalOverlay) closeModal();
});

/* Render avisos tipus còpia etc */
function renderAlerts() {
  alertContainer.innerHTML = "";

  if (!currentData) return;

  if (currentData.found === false) {
    const div = document.createElement('div');
    div.className = "warning-box warning-red";
    div.textContent = "❌ QR inexistent";
    alertContainer.appendChild(div);
    return;
  }

  if (!currentData.nom || currentData.nom.trim() === "") {
    const div = document.createElement('div');
    div.className = "warning-box warning-yellow";
    div.textContent = "⚠ Sense nom associat";
    alertContainer.appendChild(div);
  }

  if (currentData.warningReutilitzat === true) {
    const div = document.createElement('div');
    div.className = "warning-box warning-red";
    div.textContent = "❌ QR reutilitzat fa poc (possible còpia)";
    alertContainer.appendChild(div);
  }
}

/* Actualitza els botons toggle segons l'estat actual */
function renderToggleButtons() {
  if (!currentData) {
    btnTogglePagat.textContent = "Pagament ?";
    btnTogglePagat.className = "state-btn redState";

    btnToggleObjectes.textContent = "Objectes ?";
    btnToggleObjectes.className = "state-btn redState";
    return;
  }

  // PAGAT
  if (currentData.pagat === true) {
    btnTogglePagat.textContent = "PAGAT ✅";
    btnTogglePagat.className = "state-btn greenState";
  } else {
    btnTogglePagat.textContent = "NO PAGAT ❌";
    btnTogglePagat.className = "state-btn redState";
  }

  // OBJECTES
  if (currentData.objectesEntregats === true) {
    btnToggleObjectes.textContent = "OBJECTES DONATS 🎁";
    btnToggleObjectes.className = "state-btn greenState";
  } else {
    btnToggleObjectes.textContent = "OBJECTES PENDENTS 📦";
    btnToggleObjectes.className = "state-btn redState";
  }
}

/* Render targeta sota càmera */
function renderInfoCard() {
  showInfoCard();

  qrValue.textContent = currentQR || "(sense)";
  if (!currentData || currentData.found === false) {
    nomValue.textContent = currentData && currentData.found === false ? "-" : "(sense dades)";
    dataPagamentNote.textContent = "";
    renderAlerts();
    renderToggleButtons();
    return;
  }

  nomValue.textContent = currentData.nom || "(sense nom)";

  if (currentData.pagat && currentData.dataPagament) {
    dataPagamentNote.textContent = "Pagat el " + currentData.dataPagament;
  } else {
    dataPagamentNote.textContent = "";
  }

  renderAlerts();
  renderToggleButtons();
}

/* Render popup modal */
function renderModal() {
  if (!currentData) {
    modalNom.textContent = "(sense dades)";
    modalPagament.innerHTML = statusLabelRed("?");
    modalObjectes.innerHTML = statusLabelRed("?");
    openModal();
    return;
  }

  modalNom.textContent = currentData.nom || "(sense nom)";

  if (currentData.pagat === true) {
    modalPagament.innerHTML = statusLabelGreen("PAGAT ✅");
  } else {
    modalPagament.innerHTML = statusLabelRed("NO PAGAT ❌");
  }

  if (currentData.objectesEntregats === true) {
    modalObjectes.innerHTML = statusLabelGreen("OBJECTES DONATS 🎁");
  } else {
    modalObjectes.innerHTML = statusLabelRed("OBJECTES PENDENTS 📦");
  }

  openModal();
}

/* =============== API HELPERS =============== */
async function safeFetchJSON(url) {
  log("→ " + url);
  const res = await fetch(url);
  log("← STATUS " + res.status);
  const text = await res.text();
  log("← BODY " + text.slice(0,120) + (text.length>120?"...":""));
  try {
    return JSON.parse(text);
  } catch(e) {
    return null;
  }
}

async function apiLookup(qr) {
  const url = API_BASE + "?action=lookup&qr=" + encodeURIComponent(qr);
  return await safeFetchJSON(url);
}

async function apiSetPagat(qr, value) {
  const url = API_BASE + "?action=setPagat&qr=" + encodeURIComponent(qr) +
              "&value=" + encodeURIComponent(value);
  return await safeFetchJSON(url);
}

async function apiSetObjectes(qr, value) {
  const url = API_BASE + "?action=setObjectes&qr=" + encodeURIComponent(qr) +
              "&value=" + encodeURIComponent(value);
  return await safeFetchJSON(url);
}

/* =============== LÒGICA DE LECTURA QR =============== */
async function onQRDetected(qrText) {
  if (qrText === lastShownQR) {
    // si escanegues el mateix QR repetit, igualment volem refrescar i treure popup
    // pero no spamejem logs
  } else {
    log("QR detectat: " + qrText);
  }

  lastShownQR = qrText;
  currentQR = qrText;

  // demanem dades al backend
  currentData = await apiLookup(qrText);

  // actualitzem UI fixa i modal
  renderInfoCard();
  renderModal();
}

async function scanLoop() {
  if (!scanning) return;

  const w = preview.videoWidth;
  const h = preview.videoHeight;

  if (w && h) {
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(preview, 0, 0, w, h);

    try {
      const barcodes = await detector.detect(canvas);
      if (barcodes && barcodes.length > 0) {
        const raw = barcodes[0].rawValue || barcodes[0].raw || "";
        if (raw) {
          onQRDetected(raw.trim());
        }
      }
    } catch (err) {
      // ignorar errors momentanis de detecció
    }
  }

  if (scanning) {
    requestAnimationFrame(scanLoop);
  }
}

/* =============== START/STOP CÀMERA =============== */
async function startStop() {
  if (scanning) {
    scanning = false;
    scanBtn.classList.remove('active');
    scanBtn.textContent = "ESCANEJAR QR";

    if (streamRef) {
      streamRef.getTracks().forEach(t => t.stop());
      streamRef = null;
    }
    log("📹 Càmera aturada");
    return;
  }

  // iniciar
  scanning = true;
  scanBtn.classList.add('active');
  scanBtn.textContent = "CAM ACTIVA (TOCA PER ATURAR)";
  log("📹 Obrint càmera...");

  try {
    streamRef = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });

    preview.srcObject = streamRef;
    await preview.play();
    log("📹 Càmera oberta");

    if ('BarcodeDetector' in window) {
      detector = new BarcodeDetector({
        formats: ['qr_code','code_128','code_39','ean_13','ean_8']
      });
      log("BarcodeDetector inicialitzat ✅");
    } else {
      log("❌ Aquest navegador no suporta BarcodeDetector");
      alert("Aquest dispositiu no suporta lectura QR nativa.");
      scanning = false;
      return;
    }

    requestAnimationFrame(scanLoop);

  } catch (err) {
    log("ERROR càmera: " + err.name + " / " + err.message);
    alert("No puc obrir càmera: " + err.message);

    scanning = false;
    scanBtn.classList.remove('active');
    scanBtn.textContent = "ESCANEJAR QR";

    if (streamRef) {
      streamRef.getTracks().forEach(t => t.stop());
      streamRef = null;
    }
  }
}

/* =============== TOGGLES (PAGAT / OBJECTES) =============== */
btnTogglePagat.addEventListener('click', async () => {
  if (!currentQR || !currentData) return;

  // calculem quin valor hem d'enviar
  const newValue = currentData.pagat === true ? "NO" : "SI";

  await apiSetPagat(currentQR, newValue);
  currentData = await apiLookup(currentQR);

  renderInfoCard();
  renderModal(); // refresca el popup per feedback visual immediat
});

btnToggleObjectes.addEventListener('click', async () => {
  if (!currentQR || !currentData) return;

  const newValue = currentData.objectesEntregats === true ? "NO" : "SI";

  await apiSetObjectes(currentQR, newValue);
  currentData = await apiLookup(currentQR);

  renderInfoCard();
  renderModal(); // refresca el popup
});

/* =============== INIT =============== */
scanBtn.addEventListener('click', startStop);
</script>
</body>
</html>
